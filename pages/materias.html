<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UTN</title>
        <meta name="description" content="Universidad Tecnologica Nacional" />
        <link rel="stylesheet" href="../css/style.css" />
    </head>

    <body>
        <header>
            <div class="logo">
                <a href="../index.html"><img src="../assets/icono.png" alt="Logo UTN" class="logo"></a>
            </div>
            <div class="nav-links">
                <nav>
                    <a href="./alumnos.html">Alumnos</a>
                    <a href="./profesores.html">Profesores</a>
                    <a href="./materias.html">Materias</a>
                    <a href="./notas.html">Notas</a>
                </nav>
        </div>
        </header>

        <main>
            <form class="form" id="agregar-materia">
                <h2>Agregar una materia</h2>
                <div>
                    <label>Id</label>
                    <input class="input-form" id="id-agregar-materia" type="text" required />
                </div>
                <div>
                    <label>Nombre</label>
                    <input class="input-form" id="nombre-agregar-materia" type="text" required />
                </div>
                <div>
                    <label>Cuatrimestre</label>
                    <input class="input-form" id="cuatrimestre-agregar-materia" type="number" required />
                </div>
                <button class="button" type="submit">Registrar</button>
            </form>

            <form class="form" id="modificar-materia">
                <h2>Modificar una materia</h2>
                <h5>Ingrese el id de la materia que desea modificar y los nuevos datos</h5>
                <div>
                    <label>Id</label>
                    <input class="input-form" id="id-modificar-materia" type="text" required />
                </div>
                <div>
                    <label>Nombre</label>
                    <input class="input-form" id="nombre-modificar-materia" type="text" required />
                </div>
                <div>
                    <label>Cuatrimestre</label>
                    <input class="input-form" id="cuatrimestre-modificar-materia" type="number" required />
                </div>
                <button class="button" type="submit">Modificar</button>
            </form>

            <form class="form" id="eliminar-materia">
                <h2>Eliminar una materia</h2>
                <h5>Ingrese el id de la materia que desea eliminar</h5>
                <div>
                    <label>Legajo</label>
                    <input class="input-form" id="id-eliminar-materia" type="text" required />
                </div>
                <button class="button" type="submit">Eliminar</button>
            </form>

            <form class="form" id="buscar-materia">
                <h5>Ingrese el id de la materia que desea buscar</h5>
                <div>
                    <label>Legajo</label>
                    <input class="input-form" id="id-buscar-materia" type="search" />
                </div>
                <button class="button" type="submit">Buscar</button>
            </form>
        </main>

        <footer class="footer-style">
            <p>© UTN - Todos los derechos reservados</p>
        </footer>

        <script src="../js/materias.js"></script>
    </body>
</html>
